# Baut das Docker-Image von 3d-o-mat bei jedem Push auf main und legt es in die GitHub Container Registry:
# ghcr.io/marcel-b/3d-o-mat:main und :sha-<commit>. Der Container auf Proxmox baut nicht mehr selbst, er holt nur
# (deploy/proxmox/start-image.sh). Vorher laufen die Tests; schlagen sie fehl, gibt es kein Image.
name: Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/marcel-b/3d-o-mat

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Marcel-B/3d-o-mat
            org.opencontainers.image.revision=${{ github.sha }}
          # Schichten (Blender, Bewegungsbibliothek, pip) bleiben zwischen den Läufen im Cache.
          cache-from: type=gha
          cache-to: type=gha,mode=max
