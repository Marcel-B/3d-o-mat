# Im LXC auf dem Proxmox: docker compose up -d --build (Einrichtung im README).
services:
  3d-o-mat:
    build: .
    container_name: 3d-o-mat
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ./config.json:/config/config.json:ro
      # Schlüssel für die Ablage auf oi-o-mat (deploy/proxmox/3d-o-mat-lxc.sh legt ihn an).
      - ./ssh:/ssh
      - rembg-cache:/cache
volumes:
  rembg-cache:
